name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # GitHub сам поднимет Postgres и Redis для тестов
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: weather_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio ruff

    - name: Lint with ruff
      run: ruff check .

    - name: Run Alembic migrations
      env:
        DATABASE_URL: postgresql://postgres:secret@localhost:5432/weather_bot
      run: alembic upgrade head

    - name: Run tests with pytest
      env:
        DATABASE_URL: postgresql://postgres:secret@localhost:5432/weather_bot
        REDIS_URL: redis://localhost:6379/0
      run: pytest -v